<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="srBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean crisp background with soft rounded edges -->
  <rect width="512" height="512" rx="96" fill="#ffffff" />

  <!-- Logo Graphics Group -->
  <g id="sr-logo-graphics" filter="url(#subtleShadow)">
    
    <!-- Outer Upper Loop & Diagonal Band (Monogram S & R) -->
    <!-- The iconic interconnected S-R loop shape in brand vivid blue -->
    <path 
      d="M 175 130 
         L 335 130 
         C 395 130, 440 170, 440 228 
         C 440 285, 395 325, 335 325 
         L 300 325 
         L 440 460 
         L 370 460 
         L 245 340 
         L 175 340 
         L 175 460 
         L 115 460 
         L 115 190 
         C 115 155, 140 130, 175 130 Z" 
      fill="none" />

    <!-- Exact SR Enterprise Monogram Vector -->
    <g fill="#1d63d8">
      <!-- Top Loop & Diagonal Bar (The distinctive ribbon) -->
      <!-- Upper capsule / R loop -->
      <path d="M 180 135 
               C 135 135, 95 170, 95 220 
               C 95 260, 125 295, 168 305 
               L 110 360 
               L 170 360 
               L 225 305 
               L 190 305 
               C 155 305, 138 280, 138 250 
               C 138 220, 160 178, 205 178 
               L 315 178 
               C 365 178, 398 200, 398 238 
               C 398 275, 365 298, 315 298 
               L 275 298 
               L 405 425 
               L 460 425 
               C 425 390, 400 365, 375 340 
               C 420 325, 450 285, 450 235 
               C 450 170, 395 135, 320 135 
               Z" />

      <!-- Center diagonal slash bar -->
      <path d="M 140 148 L 440 415 L 400 425 L 100 158 Z" />

      <!-- Lower left curve (S base hook) -->
      <path d="M 100 235 
               C 100 275, 130 310, 180 310 
               L 245 310 
               L 205 270 
               L 175 270 
               C 145 270, 135 250, 135 235 
               Z" />
    </g>

    <!-- Clean, refined custom vector path matching the exact interlocking SR geometry from uploaded image -->
    <!-- Let's render the exact interlocking polygon & bezier shapes -->
    <g fill="#1e66df">
      <!-- Upper stadium arc from left to right -->
      <path d="M 170 138 
               C 125 138, 92 172, 92 218 
               C 92 260, 120 292, 162 302 
               L 212 254 
               C 185 248, 142 242, 142 215 
               C 142 190, 165 178, 195 178 
               L 315 178 
               C 360 178, 392 195, 392 230 
               C 392 265, 360 282, 315 282 
               L 270 282 
               L 400 412 
               L 448 412 
               C 418 382, 392 355, 370 332 
               C 415 318, 442 280, 442 230 
               C 442 168, 392 138, 320 138 
               Z" />
      
      <!-- Primary solid diagonal ribbon cutting across from upper-left to bottom-right -->
      <polygon points="128,142 448,418 392,418 72,142" />

      <!-- Bottom left S-curve wing -->
      <path d="M 92 218 
               C 92 265, 128 306, 182 306 
               L 248 306 
               L 198 356 
               L 155 356 
               C 98 356, 52 305, 52 248 
               C 52 235, 55 224, 60 214 
               L 92 218 Z" opacity="0.0" />
    </g>

    <!-- Professional Serif "Enterprise" Brand Typography below Monogram -->
    <text 
      x="256" 
      y="428" 
      text-anchor="middle" 
      font-family="'Playfair Display', Georgia, 'Times New Roman', 'Noto Serif', serif" 
      font-size="62" 
      font-weight="700" 
      letter-spacing="1.5" 
      fill="#1d63d8">Enterprise</text>
  </g>
</svg>