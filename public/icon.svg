<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Blue R Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Green R Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle grid / tech line accents in background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Centered Logo Graphics Group -->
  <g transform="translate(26, 36) scale(0.9)">
    
    <!-- ================= 1. FIRST 'R' (ELECTRIC BLUE & CIRCUIT) ================= -->
    <!-- R Body Base -->
    <path d="M 60 70 L 140 70 C 185 70, 205 92, 205 130 C 205 165, 180 185, 140 188 L 195 270 L 152 270 L 105 195 L 100 195 L 100 270 L 60 270 Z" 
          fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- R Inner Cutout Hole -->
    <path d="M 100 110 L 135 110 C 158 110, 168 118, 168 132 C 168 146, 158 154, 135 154 L 100 154 Z"
          fill="none" stroke="url(#blueGrad)" stroke-width="12" />

    <!-- Circuit board lines & nodes inside left R -->
    <g stroke="#38bdf8" stroke-width="3.5" fill="#38bdf8">
      <!-- Circuit horizontal branch -->
      <line x1="78" y1="95" x2="120" y2="95" />
      <circle cx="120" cy="95" r="4.5" />
      
      <!-- Circuit vertical stem trace -->
      <line x1="78" y1="130" x2="78" y2="230" />
      <line x1="78" y1="180" x2="95" y2="180" />
      <circle cx="95" cy="180" r="4" />
      <circle cx="78" cy="230" r="4.5" />
      
      <!-- Slanted leg trace -->
      <line x1="140" y1="210" x2="175" y2="260" />
      <circle cx="140" cy="210" r="4" />
    </g>

    <!-- ================= 2. LIGHTNING BOLT (BETWEEN R's) ================= -->
    <polygon points="190,65 170,165 205,160 178,255 228,145 195,150" 
             fill="url(#sparkGrad)" filter="url(#subtleGlow)" />
    
    <!-- ================= 3. SECOND 'R' (VIBRANT GREEN & CIRCUIT) ================= -->
    <!-- R Body -->
    <path d="M 215 70 L 295 70 C 340 70, 360 92, 360 130 C 360 165, 335 185, 295 188" 
          fill="none" stroke="url(#greenGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Vertical stem of green R -->
    <line x1="230" y1="70" x2="230" y2="270" stroke="url(#greenGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Inner Hole for Green R -->
    <path d="M 230 110 L 290 110 C 313 110, 323 118, 323 132 C 323 146, 313 154, 290 154 L 230 154 Z"
          fill="none" stroke="url(#greenGrad)" stroke-width="12" />

    <!-- Circuit Trace on Right R leading to Smart Meter -->
    <!-- Lower leg curving right and then up into the meter -->
    <path d="M 275 192 L 305 240 L 370 240 L 370 200" 
          fill="none" stroke="url(#greenGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Circuit decorative trace & dots -->
    <g stroke="#34d399" stroke-width="3" fill="#34d399">
      <line x1="285" y1="95" x2="315" y2="95" />
      <circle cx="315" cy="95" r="4" />
      <line x1="245" y1="130" x2="245" y2="230" />
      <circle cx="245" cy="230" r="4.5" />
      <!-- Circuit node on horizontal run -->
      <circle cx="335" cy="240" r="4.5" />
    </g>

    <!-- ================= 4. SMART METER GAUGE ================= -->
    <g transform="translate(370, 145)">
      <!-- Meter Gauge Base Terminal Connector -->
      <rect x="-24" y="32" width="48" height="24" rx="5" fill="#10b981" />
      <!-- Terminal Arrows ⬆️ ⬆️ -->
      <g fill="#ffffff">
        <polygon points="-12,48 -12,42 -16,42 -10,36 -4,42 -8,42 -8,48" />
        <polygon points="8,48 8,42 4,42 10,36 16,42 12,42 12,48" />
      </g>

      <!-- Gauge Outer Blue Circle -->
      <circle cx="0" cy="0" r="46" fill="#0f172a" stroke="#0284c7" stroke-width="9" filter="url(#subtleGlow)" />
      <!-- Gauge Inner White Face -->
      <circle cx="0" cy="0" r="37" fill="#f8fafc" />

      <!-- Gauge Dial Ticks -->
      <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
        <line x1="-24" y1="-8" x2="-18" y2="-6" />
        <line x1="-20" y1="-18" x2="-15" y2="-14" />
        <line x1="-12" y1="-25" x2="-9" y2="-19" />
        <line x1="0" y1="-28" x2="0" y2="-21" />
        <line x1="12" y1="-25" x2="9" y2="-19" />
        <line x1="20" y1="-18" x2="15" y2="-14" />
        <line x1="24" y1="-8" x2="18" y2="-6" />
      </g>

      <!-- Gauge Digital Display Bar (Bottom segment of dial) -->
      <rect x="-18" y="10" width="36" height="12" rx="3" fill="#0284c7" />
      <g fill="#ffffff">
        <circle cx="-10" cy="16" r="2" />
        <circle cx="-3" cy="16" r="2" />
        <circle cx="4" cy="16" r="2" />
        <circle cx="11" cy="16" r="2" />
      </g>

      <!-- Gauge Needle (Pointing to 70% power) -->
      <line x1="0" y1="2" x2="16" y2="-18" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="2" r="5" fill="#1e293b" />

      <!-- Top Electric Spark on Gauge -->
      <polygon points="0,-64 -6,-52 -1,-52 -4,-44 6,-54 1,-54" fill="#10b981" filter="url(#subtleGlow)" />
    </g>

    <!-- ================= 5. BRANDING TYPOGRAPHY ================= -->
    <!-- "RR ENTERPRISES" -->
    <text x="235" y="340" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="2"
          text-anchor="middle" 
          fill="#ffffff">
      <tspan fill="#38bdf8">RR </tspan>
      <tspan fill="#ffffff">ENTERPRISES</tspan>
    </text>

    <!-- "SMART METER INSTALLATION" -->
    <text x="235" y="375" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="16.5" 
          font-weight="800" 
          letter-spacing="4"
          text-anchor="middle" 
          fill="#34d399">
      SMART METER INSTALLATION
    </text>

    <!-- "ELECTRICAL WORK" Subtext badge -->
    <rect x="135" y="392" width="200" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="235" y="407" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="3"
          text-anchor="middle" 
          fill="#94a3b8">
      ELECTRICAL WORK
    </text>

  </g>
</svg>